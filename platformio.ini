; PlatformIO Project Configuration File for ESP32 BLE Sniffer
; Core functionality: BLE device scanning and REST API data reporting

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200

; Custom partition table with larger app partition
board_build.partitions = partitions.csv

; Upload settings
upload_speed = 921600

; ESP32-C3 specific settings
board_build.flash_mode = dio

[env:esp32c3-debug]
extends = env:esp32c3
build_type = debug
