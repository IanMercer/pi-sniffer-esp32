; PlatformIO Project Configuration File for ESP32 BLE Sniffer
; Core functionality: BLE device scanning and REST API data reporting

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
build_flags = 
    -DDEVICE_NAME=\"5003\"

; Custom partition table with larger app partition
board_build.partitions = partitions.csv

; Upload settings
upload_speed = 921600

; ESP32-S3 specific settings
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB

[env:esp32s3-debug]
extends = env:esp32s3
build_type = debug

; ESP32-C5 board without the SIM7670G modem - WiFi-only reporting, no
; GNSS/cellular. Capability flags override the #ifndef defaults in config.h.
; 8MB flash (detected via esptool flash_id); flash size is also set in
; sdkconfig.defaults.esp32c5, which ESP-IDF applies on top of
; sdkconfig.defaults for this target.
[env:esp32c5]
platform = espressif32
board = esp32-c5-devkitc1-n8r4
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions_8mb.csv
board_build.flash_mode = dio
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
build_flags =
    -DENABLE_CELLULAR=0
    -DENABLE_GNSS=0
    -DREPORT_TRANSPORT=REPORT_TRANSPORT_WIFI
    -DUSE_STATIC_WIFI_CREDENTIALS=1
    ; per-advertisement logging starves the single core (task_wdt on IDLE)
    -DDEBUG_DEVICE_DISCOVERY=0

[env:esp32c5-debug]
extends = env:esp32c5
build_type = debug
